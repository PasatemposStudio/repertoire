<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://www.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repertoire">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Repertoire</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icon.png">
</head>
<body>
<div id="app">
  <!-- KÜTÜPHANE -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand"><img src="icon.png" alt="">Repertoire</div>
      <button class="icon" id="btnNew" title="Yeni şarkı (Ctrl+N)">＋</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Şarkı, sanatçı ara…  (Ctrl+F)" autocomplete="off">
    </div>
    <div class="side-filters">
      <select id="sortBy" title="Gruplama ve sıralama">
        <option value="lang-artist">Dil › Sanatçı</option>
        <option value="lang">Dile göre</option>
        <option value="artist">Sanatçıya göre</option>
        <option value="title">Başlığa göre (A–Z)</option>
        <option value="recent">Son değişen</option>
      </select>
      <label class="chk" title="Söz ve akorların içinde de ara"><input type="checkbox" id="searchLyrics"> sözlerde</label>
    </div>
    <div class="side-filters">
      <select id="langFilter" title="Dile göre süz"></select>
      <select id="artistFilter" title="Sanatçıya göre süz"></select>
    </div>
    <div id="songList" tabindex="0"></div>
    <div class="side-foot"><span id="count"></span><span id="syncStatus" title="Drive senkron durumu"></span><button class="link" id="btnExpand" title="Tüm grupları aç / kapat">Aç / Kapat</button><button class="link" id="btnRescan" title="Klasörleri yeniden tara">Yenile</button></div>
  </aside>
  <div id="resizer" title="Sürükleyerek genişlet"></div>

  <!-- ŞARKI -->
  <main id="main">
    <header id="toolbar">
      <button class="icon" id="btnSidebar" title="Kütüphaneyi gizle/göster (Ctrl+B)">☰</button>
      <button class="icon" id="btnHome" title="Ana sayfa"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></button>
      <div class="group" title="Transpoze ([ ve ] tuşları)">
        <span class="glabel">Ton</span>
        <button id="trDown">−</button><span id="trVal" class="val">0</span><button id="trUp">+</button>
      </div>
      <div class="group" title="Capo">
        <span class="glabel">Capo</span>
        <button id="capoDown">−</button><span id="capoVal" class="val">0</span><button id="capoUp">+</button>
      </div>
      <div class="group" title="Yakınlaştır (Ctrl + / Ctrl −)">
        <span class="glabel">Boyut</span>
        <button id="zoomDown">−</button><span id="zoomVal" class="val">100%</span><button id="zoomUp">+</button>
      </div>
      <div class="group" title="Otomatik kaydırma (Boşluk)">
        <button id="btnScroll" class="wide">▶ Kaydır</button>
        <input type="range" id="scrollSpeed" min="5" max="150" value="30">
      </div>
      <div class="spacer"></div>
      <button class="icon" id="btnCols" title="Sütun sayısı">▥</button>
      <button class="icon" id="btnDiagrams" title="Akor diyagramlarını göster/gizle">♯</button>
      <button class="icon" id="btnEdit" title="Düzenle (E)">✎</button>
      <button class="icon" id="btnFull" title="Tam ekran (F11)">⛶</button>
      <button class="icon" id="btnSettings" title="Ayarlar">⚙</button>
    </header>
    <div id="songWrap">
      <div id="empty" class="welcome">
        <img class="welcome-logo" src="icon.png" alt=""><h2>Repertoire</h2>
        <p>Başlamak için şarkılarının bulunduğu klasörü ekle.<br>Google Drive klasörünü de seçebilirsin; değişiklikler otomatik senkronlanır.</p>
        <button class="primary" id="btnAddFolderEmpty">Klasör ekle</button>
      </div>
      <div id="home" hidden></div>
      <article id="song" hidden></article>
    </div>
  </main>
</div>

<!-- Akor açılır penceresi -->
<div id="chordPop" hidden>
  <div class="cp-head"><span id="cpName"></span><button class="icon sm" id="cpClose">✕</button></div>
  <div id="cpSvg"></div>
  <div class="cp-nav"><button id="cpPrev">‹</button><span id="cpIdx"></span><button id="cpNext">›</button></div>
  <div id="cpNote"></div>
</div>

<!-- Düzenleyici -->
<div id="editor" hidden>
  <div class="ed-bar">
    <strong id="edTitle">Düzenle</strong>
    <div class="ed-tools">
      <button data-ins="{title: }">Başlık</button>
      <button data-ins="{artist: }">Sanatçı</button>
      <button data-ins="{key: }">Ton</button>
      <button data-ins="{capo: }">Capo</button>
      <button data-wrap="{soc}|{eoc}">Nakarat</button>
      <button data-wrap="{sot}|{eot}">Tab</button>
      <button data-ins="{c: }">Not</button>
      <button id="edToInline" title="Üstte akor/altta söz satırlarını [Am]söz biçimine çevir">Akorları satıra göm</button>
    </div>
    <div class="spacer"></div>
    <button id="edCancel">Vazgeç</button>
    <button class="primary" id="edSave">Kaydet (Ctrl+S)</button>
  </div>
  <div class="ed-body">
    <textarea id="edText" spellcheck="false"></textarea>
    <div id="edPreview" class="song-render"></div>
  </div>
</div>

<!-- Ayarlar -->
<aside id="settings" hidden>
  <div class="st-head"><strong>Ayarlar</strong><button class="icon sm" id="stClose">✕</button></div>
  <div class="st-body" id="stBody"></div>
</aside>

<div id="toast" hidden></div>

<div id="scrim"></div>
<script src="config.js"></script>
<script src="music.js"></script>
<script src="storage-web.js"></script>
<script src="app.js"></script>
</body>
</html>
